name: Unity Source Package Sanity
on:
  push:
    branches: [main, 'feat/**', 'feature/**']
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python tools/validate_project.py
# This checks package structure and energy math only. It does not compile Unity C#.
